name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build x64 Lite
        run: msbuild TrafficMonitor_Lite.sln -t:TrafficMonitor -m -p:Configuration="Release (lite)" -p:Platform=x64 -p:PlatformToolset=v143
      - name: Package portable build
        run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: HardwarePulse-x64
          path: Bin/HardwarePulse-x64.zip
          if-no-files-found: error
